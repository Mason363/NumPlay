name: Build

# Builds NumPlay.nwa, its discreet versions and every game on its own, and publishes them as a GitHub
# release when main reaches a version (VERSION) not released yet. Pushing a tag like v1.2.0 does too.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ARM toolchain
        run: |
          v=15.2.1-1.1
          curl -sSL "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$v/xpack-arm-none-eabi-gcc-$v-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xpack-arm-none-eabi-gcc-$v/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -yq pngquant
          pip install pillow numpy zopfli pyelftools unicorn==2.1.4
          npm install -g nwlink@1.0.0
          rustup target add thumbv7em-none-eabihf

      - name: Build
        run: python3 tools/build.py -j 4 && make kit-langs NWLINK=nwlink
        
      - uses: actions/upload-artifact@v4
        with:
          name: nwa
          path: |
            build/compiled/NumPlay*.nwa
            build/compiled/games/*.nwa

      - name: Test
        run: |
          python3 tests/test_games.py build/compiled/games
          python3 tests/test_uninstall.py build/compiled/NumPlay.nwa --game numdrive
          python3 tests/test_progress.py build/compiled/NumPlay.nwa
          python3 tests/test_numblocks_progress.py build/compiled/games/NumBlocks.nwa
          python3 tests/test_upsilon.py build/compiled/NumPlay-Upsilon.nwa
          python3 tests/test_small_ram.py build/compiled/NumPlay.nwa
          make -C games/numblocks host test
          make -C games/championisland host test
          make -C games/undertale host test
          make -C games/doom host test
          make -C games/isaac host test
          make -C games/pvz host test
          make -C games/fnaf host test
          make -C games/sonic host test
          make -C games/subway host test
          make -C games/hillclimb host test
          make -C games/leveldevil host test
          make -C games/cookieclicker host test
          make -C games/jetpackjoyride host test
          make -C games/donkeykong host test
          make -C games/dune host test
          make -C games/monkeymart host test
          make -C games/tombofthemask host test
          make -C games/invaders host test
          make -C games/sudoku host test
          make -C games/uttt host test
          make -C games/sokoban host test
          make -C games/twoplayer host test
          make -C games/flappydunk host test
          make -C games/towerblock host test
          make -C games/suika host test
          make -C games/doodlejump host test
          make -C games/stickmanhook host test
          make -C games/coreball host test
          make -C games/uno host test
          make -C games/fnf host test BUILD_DIR=../../build/data/games/fnf
          make -C games/turborush host test BUILD_DIR=../../build/data/games/turborush
          make -C games/angrybirds host test
          make -C games/polytrack host test
          make -C games/paperclips host test



      - name: Kit for the website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # NumPlay Studio (customize/) links a NumPlay of your own from the kit (make kit): it goes on the
        # branch "kit", one commit, and the site is deployed again with it
        run: |
          cd build/data/site-kit
          git init -q -b kit
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Kit of NumPlay $(tr -d '[:space:]' < ../../../VERSION), from $GITHUB_SHA"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" kit
          gh workflow run pages.yml --ref main || echo "(the site was not deployed again)"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag pushed, or on main v + VERSION (made here if it isn't released yet). GitHub lists the
        # files A to Z: the notes list them in order, and each file gets a label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(tr -d '[:space:]' < VERSION)"; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          python3 tools/release.py --tag "$tag" --notes build/data/release-notes.md --title build/data/release-title.txt \
            --build build/compiled > build/data/release-files.txt
          mapfile -t files < build/data/release-files.txt
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "$(cat build/data/release-title.txt)" --notes-file build/data/release-notes.md
          # the README's version and downloads badges come from the site (docs/badges): deploy it again
          gh workflow run pages.yml --ref main || echo "(the site was not deployed again)"
