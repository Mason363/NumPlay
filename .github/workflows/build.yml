name: Build

# Builds NumPlay.nwa, its discreet versions and every game on its own, tests them in eight parts side by side,
# then gives NumPlay Studio the new kit and publishes a GitHub release when main reaches a version (VERSION) not
# released yet. Pushing a tag like v1.2.0 does too.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One run of main at a time: a push waits for the run before it, and a newer push replaces one still waiting
# (tags and pull requests each have their own)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: python3 tools/build.py -j 4 && make kit-langs NWLINK=nwlink

      - uses: actions/upload-artifact@v4
        with:
          name: nwa
          path: |
            build/compiled/NumPlay*.nwa
            build/compiled/games/*.nwa

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/compiled
            build/data/site-kit

  # Each part builds again (faster than handing over the whole build) and runs its share: tests/ci.py
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: python3 tools/build.py -j 4

      - name: Test
        run: python3 tests/ci.py --shard ${{ matrix.shard }} --of 8

  publish:
    needs: [build, test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: build

      - name: Kit for the website
        env:
          GH_TOKEN: ${{ github.token }}
        # NumPlay Studio (customize/) links a NumPlay of your own from the kit (make kit): it goes on the
        # branch "kit", one commit, and the site is deployed again with it. Any run of a commit newer than the
        # kit's makes it, so the Studio has every game as soon as one build of it ends; a run of an older commit
        # that ends last leaves the newer kit alone
        run: |
          kit=$(gh api "repos/$GITHUB_REPOSITORY/commits/kit" --jq .commit.message 2>/dev/null | grep -o '[0-9a-f]\{40\}' | tail -1)
          if [ -n "$kit" ]; then
            how=$(gh api "repos/$GITHUB_REPOSITORY/compare/$kit...$GITHUB_SHA" --jq .status 2>/dev/null || echo unknown)
            if [ "$how" != ahead ]; then
              echo "(the kit is from $kit, which this commit isn't newer than: $how)"
              exit 0
            fi
          fi
          cd build/data/site-kit
          git init -q -b kit
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Kit of NumPlay $(tr -d '[:space:]' < ../../../VERSION), from $GITHUB_SHA"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" kit
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY" || echo "(the site was not deployed again)"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag pushed, or on main v + VERSION (made here if it isn't released yet). GitHub lists the
        # files A to Z: the notes list them in order, and each file gets a label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(tr -d '[:space:]' < VERSION)"; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          python3 tools/release.py --tag "$tag" --notes build/data/release-notes.md --title build/data/release-title.txt \
            --build build/compiled > build/data/release-files.txt
          mapfile -t files < build/data/release-files.txt
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "$(cat build/data/release-title.txt)" --notes-file build/data/release-notes.md
          # the README's version and downloads badges come from the site (docs/badges): deploy it again
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY" || echo "(the site was not deployed again)"
