name: Beta tester
description: Something doesn't work on your TI-84 Plus CE, TI-Nspire or Casio
title: "Beta tester: "
labels: ["beta tester"]
body:
  - type: markdown
    attributes:
      value: |
        **Looking for the games?** They're out. Get them for your calculator from [its page](https://github.com/Mason363/NumPlay#pick-your-calculator), no issue needed.

        Open one here only when something doesn't work. Your name goes in the credits.
  - type: dropdown
    id: model
    attributes:
      label: Calculator
      description: The name is written above the screen.
      options:
        - TI-84 Plus CE
        - TI-84 Plus CE Python
        - TI-83 Premium CE
        - TI-Nspire CX
        - TI-Nspire CX II
        - Casio fx-CG50
        - Casio Graph 90+E
        - Casio fx-CG10 or fx-CG20
        - Another one (say which below)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Its software version
      description: "TI-84 Plus CE: 2nd, +, About. TI-Nspire: Home, 5, 4. Casio: MENU, System, Version."
      placeholder: "5.8.0"
  - type: input
    id: game
    attributes:
      label: Game
      placeholder: "Celeste"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw. A photo helps.
    validations:
      required: true
