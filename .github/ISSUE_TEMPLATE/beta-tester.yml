name: Beta tester
description: Test NumPlay on your TI, Casio or other calculator before everyone else
title: "Beta tester: "
labels: ["beta tester"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Each new build for your calculator comes to this issue first. Try it, say what works and what doesn't, and your name goes in the credits.
  - type: dropdown
    id: model
    attributes:
      label: Calculator
      description: The name is written above the screen. Pick all you have.
      multiple: true
      options:
        - TI-84 Plus CE
        - TI-84 Plus CE Python
        - TI-83 Premium CE
        - TI-Nspire CX
        - TI-Nspire CX II
        - Casio fx-CG50
        - Casio Graph 90+E
        - Casio fx-CG10 or fx-CG20
        - Casio Graph 35+E II
        - Casio fx-9750GIII or fx-9860GIII
        - NumWorks
        - Another one (say which below)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Its software version
      description: "TI-84 Plus CE: 2nd, +, About. TI-Nspire: Home, 5, 4. Casio: MENU, System, Version."
      placeholder: "5.8.0"
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Another calculator you have, if Ndless or arTIfiCE is already on it, games you'd like to try first.
