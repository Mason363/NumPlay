title: NumPlay
description: "Free games for graphing calculators, the NumWorks, the TI-Nspire CX and the Casio fx-CG50. 28 for the NumWorks in one app: NumDash, Crossy Road, NumBlocks, NumDrive, Balatro, Buckshot Roulette, Block Blast, Suika Game, Portal Returns, Tetris, Chrome Dino, Chess, Space Invaders, Sudoku and more. And Doom, Sonic, Plants vs. Zombies, Cookie Clicker, Mahjong, Meowdoku, Rider, Snow Rider 3D, Temple Run, Five Nights at Freddy's 2, Famidash, Clash Royale, Cat Ninja, Kingdom Rush, Deltarune, FNAF World, Mr Bullet, Moto X3M, Among Us, Imposter, 2 3 4 Players, circloO, Doodle Jump and more on their own. Free and open source, with a kit to make your own NumWorks games in C."
url: https://mason363.github.io
baseurl: /NumPlay
theme: jekyll-theme-cayman
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
exclude: [games, launcher, tools, tests, build, sdk, LICENSES, Makefile, .github]
