title: NumPlay
description: "29 games for the NumWorks calculator in one app: NumDash, Crossy Road, NumBlocks, NumDrive, Balatro, Buckshot Roulette, Block Blast, Suika Game, Portal Returns, Tetris, Chrome Dino, Chess, Space Invaders, Sudoku and more. And Doom, Sonic, Plants vs. Zombies, Cookie Clicker, Meowdoku and more on their own. Free and open source, with a kit to make your own NumWorks games in C."
